version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/test-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directories:
      - /packages/tauri-plugin-mcp-bridge
      - /packages/test-app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
